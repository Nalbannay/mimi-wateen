/* Layout: one screen. A vivid color field fills the display and changes with the mode
   (focus = her own color, breaks = teal / blue). Hero = white ring around a disc where a
   flower grows while she studies; huge digits under it; glass controls below.
   Garden + settings = white cards floating on the same color field. */
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #F0337F; }
@property --c2 { syntax: '<color>'; inherits: true; initial-value: #FF5A5F; }

:root {
  /* palettes: 1/2 = background gradient, deep = color on white, tint = accent on cards */
  --rose1: #F0337F; --rose2: #FF5A5F; --rose-deep: #D3175E; --rose-tint: #D3175E;
  --violet1: #9152FF; --violet2: #5A45EF; --violet-deep: #5B2BDB; --violet-tint: #5B2BDB;
  --berry1: #D838D6; --berry2: #8B2EE0; --berry-deep: #A11AB5; --berry-tint: #A11AB5;
  --tangerine1: #F36A12; --tangerine2: #EC3B55; --tangerine-deep: #C2410C; --tangerine-tint: #C2410C;
  --tomato1: #F2413C; --tomato2: #D41F68; --tomato-deep: #BE1B2B; --tomato-tint: #BE1B2B;
  --teal1: #0B9C88; --teal2: #0A7FBF; --teal-deep: #04786A; --teal-tint: #04786A;
  --sky1: #2F7BF5; --sky2: #5544E8; --sky-deep: #1E4FD1; --sky-tint: #1E4FD1;

  --c1: var(--rose1); --c2: var(--rose2); --deep: var(--rose-deep); --accent: var(--rose-tint);

  /* on the color field */
  --on: #FFFFFF; --on-soft: rgba(255, 255, 255, .88); --on-faint: rgba(255, 255, 255, .6);
  --glass: rgba(255, 255, 255, .2); --glass-line: rgba(255, 255, 255, .36);
  --ring-track: rgba(255, 255, 255, .3);
  --blob: rgba(255, 255, 255, .2);
  --text-shadow: 0 2px 14px rgba(60, 10, 40, .18);
  --scrim: rgba(30, 12, 44, .44);

  /* cards and sheets */
  --surface: #FFFFFF; --surface-2: #F7F2FC; --ink: #2A1840; --ink-soft: #6C5A82; --line: #EBE2F4;
  --danger: #D2283E;
  --shadow: 0 14px 34px rgba(42, 24, 64, .22);

  /* illustration */
  --disc1: #FFFFFF; --disc2: #FFF2F8;
  --stem: #2F9E58; --leaf: #45BF69; --leaf-vein: #2A8A4C; --soil: #6B3F2A; --seed: #9A6235;
  --sun: #FFC93C; --shine: rgba(255, 255, 255, .3); --ground: rgba(42, 24, 64, .1);
  --steam: rgba(90, 70, 120, .34);
  --bed-sky1: #EAF6FF; --bed-sky2: #F7FBFF; --grass: #7AD48C; --grass-dark: #4FB86A;

  --font: 'Baloo Bhaijaan 2', 'SF Arabic', 'Geeza Pro', 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rose1: #A3134F; --rose2: #5B0F37; --rose-tint: #FF72A8;
    --violet1: #4F22B3; --violet2: #221565; --violet-tint: #B49AFF;
    --berry1: #8D1A8E; --berry2: #3E1170; --berry-tint: #F07CF0;
    --tangerine1: #A3400B; --tangerine2: #5C1427; --tangerine-tint: #FFA066;
    --tomato1: #A51D22; --tomato2: #570E2C; --tomato-tint: #FF7C7C;
    --teal1: #05665A; --teal2: #073E5C; --teal-tint: #4FE0C2;
    --sky1: #1A4AAE; --sky2: #1B1663; --sky-tint: #8DB9FF;
    --glass: rgba(255, 255, 255, .13); --glass-line: rgba(255, 255, 255, .24);
    --ring-track: rgba(255, 255, 255, .2); --blob: rgba(255, 255, 255, .08);
    --scrim: rgba(0, 0, 0, .58);
    --surface: #20152F; --surface-2: #2A1E3C; --ink: #F6EEFF; --ink-soft: #BCAAD1; --line: #3A2B4E;
    --danger: #FF8A96;
    --shadow: 0 14px 34px rgba(0, 0, 0, .45);
    --disc1: rgba(255, 255, 255, .14); --disc2: rgba(255, 255, 255, .05);
    --ground: rgba(0, 0, 0, .25); --steam: rgba(255, 255, 255, .45);
    --bed-sky1: #1E2747; --bed-sky2: #2A1E3C; --grass: #2E8A4E; --grass-dark: #236E3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rose1: #A3134F; --rose2: #5B0F37; --rose-tint: #FF72A8;
  --violet1: #4F22B3; --violet2: #221565; --violet-tint: #B49AFF;
  --berry1: #8D1A8E; --berry2: #3E1170; --berry-tint: #F07CF0;
  --tangerine1: #A3400B; --tangerine2: #5C1427; --tangerine-tint: #FFA066;
  --tomato1: #A51D22; --tomato2: #570E2C; --tomato-tint: #FF7C7C;
  --teal1: #05665A; --teal2: #073E5C; --teal-tint: #4FE0C2;
  --sky1: #1A4AAE; --sky2: #1B1663; --sky-tint: #8DB9FF;
  --glass: rgba(255, 255, 255, .13); --glass-line: rgba(255, 255, 255, .24);
  --ring-track: rgba(255, 255, 255, .2); --blob: rgba(255, 255, 255, .08);
  --scrim: rgba(0, 0, 0, .58);
  --surface: #20152F; --surface-2: #2A1E3C; --ink: #F6EEFF; --ink-soft: #BCAAD1; --line: #3A2B4E;
  --danger: #FF8A96;
  --shadow: 0 14px 34px rgba(0, 0, 0, .45);
  --disc1: rgba(255, 255, 255, .14); --disc2: rgba(255, 255, 255, .05);
  --ground: rgba(0, 0, 0, .25); --steam: rgba(255, 255, 255, .45);
  --bed-sky1: #1E2747; --bed-sky2: #2A1E3C; --grass: #2E8A4E; --grass-dark: #236E3D;
  color-scheme: dark;
}

/* which palette is active: her color, both girls (welcome), or a break */
:root[data-accent="violet"] { --c1: var(--violet1); --c2: var(--violet2); --deep: var(--violet-deep); --accent: var(--violet-tint); }
:root[data-accent="berry"] { --c1: var(--berry1); --c2: var(--berry2); --deep: var(--berry-deep); --accent: var(--berry-tint); }
:root[data-accent="tangerine"] { --c1: var(--tangerine1); --c2: var(--tangerine2); --deep: var(--tangerine-deep); --accent: var(--tangerine-tint); }
:root[data-accent="tomato"] { --c1: var(--tomato1); --c2: var(--tomato2); --deep: var(--tomato-deep); --accent: var(--tomato-tint); }
:root[data-accent="duo"] { --c1: var(--rose1); --c2: var(--violet2); --deep: var(--rose-deep); --accent: var(--rose-tint); }
:root[data-mode="short"] { --c1: var(--teal1); --c2: var(--teal2); --deep: var(--teal-deep); --accent: var(--teal-tint); }
:root[data-mode="long"] { --c1: var(--sky1); --c2: var(--sky2); --deep: var(--sky-deep); --accent: var(--sky-tint); }

/* ---------- base ---------- */
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--c1); overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--c1); color: var(--on);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--on); outline-offset: 3px; }
.card :focus-visible, .sheet-panel :focus-visible { outline-color: var(--accent); }

#bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(165deg, var(--c1) 0%, var(--c2) 100%);
  transition: --c1 .9s ease, --c2 .9s ease;
}
#bg .blob { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--blob), transparent 68%); }
#bg .b1 { width: 80vmax; height: 80vmax; top: -34vmax; inset-inline-end: -28vmax; animation: drift 26s ease-in-out infinite alternate; }
#bg .b2 { width: 60vmax; height: 60vmax; bottom: -26vmax; inset-inline-start: -24vmax; animation: drift 32s ease-in-out -8s infinite alternate-reverse; }
@keyframes drift { to { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); } }

#app { position: relative; z-index: 1; height: 100%; }
.view {
  height: 100%; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- shared controls ---------- */
.icon-btn {
  position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  background: var(--glass); border: 1px solid var(--glass-line); color: var(--on);
}
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn:active, .ctl:active, .btn:active, .pcard:active { transform: scale(.95); }
.count {
  position: absolute; top: -5px; inset-inline-end: -5px; min-width: 21px; height: 21px; padding-inline: 5px;
  border-radius: 999px; background: var(--on); color: var(--deep);
  font-size: 12px; font-weight: 800; line-height: 21px; text-align: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 24px; min-height: 50px;
  font-weight: 800; font-size: 17px; line-height: 1.2; text-align: center;
}
.btn-primary { background: linear-gradient(160deg, var(--c1), var(--c2)); color: var(--on); box-shadow: 0 8px 20px rgba(42, 24, 64, .18); }
.btn-white { background: var(--on); color: var(--deep); box-shadow: 0 10px 24px rgba(42, 24, 64, .2); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); }
.btn-sm { min-height: 46px; padding: 10px 18px; font-size: 16px; }
.wide { width: 100%; }

/* ---------- welcome + profiles ---------- */
#v-welcome, #v-profiles { justify-content: center; padding-block: 24px; }
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; width: min(100%, 470px); margin: auto; }
.welcome-art { width: min(64vw, 40dvh, 270px); aspect-ratio: 1; max-width: 100%; animation: float 5s ease-in-out infinite alternate; }
.welcome-art svg { width: 100%; height: 100%; overflow: visible; }
@keyframes float { to { transform: translateY(-8px) rotate(1.5deg); } }
.welcome h1 { margin: 0; font-size: clamp(32px, 9vw, 46px); font-weight: 800; line-height: 1.15; text-wrap: balance; text-shadow: var(--text-shadow); }
.welcome p { margin: 0; font-size: 18px; font-weight: 600; color: var(--on-soft); line-height: 1.7; text-wrap: balance; max-width: 34ch; }
.welcome .btn { min-width: 200px; margin-top: 6px; font-size: 19px; }

.profiles-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(100%, 620px); margin: auto; }
.profiles-title { margin: 0; font-size: clamp(30px, 8vw, 42px); font-weight: 800; text-align: center; line-height: 1.2; text-shadow: var(--text-shadow); }
.profile-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.pcard {
  border: 0; border-radius: 30px; background: var(--surface); color: var(--ink);
  padding: 22px 10px 18px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: var(--shadow); min-width: 0; transition: transform .15s;
}
.pcard-av {
  width: min(27vw, 124px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  font-size: min(14vw, 62px); line-height: 1; margin-bottom: 8px;
  background: linear-gradient(160deg, var(--p1), var(--p2)); box-shadow: inset 0 -7px 0 rgba(0, 0, 0, .1);
}
.pcard-name { font-size: clamp(24px, 6.5vw, 30px); font-weight: 800; line-height: 1.2; }
.pcard-meta { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.pcard.active { box-shadow: var(--shadow), 0 0 0 4px var(--on); }
.install-hint {
  margin: 0; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px;
  padding: 12px 16px; font-size: 15px; font-weight: 600; line-height: 1.6; text-align: center; color: var(--on); max-width: 440px;
}
.install-hint svg { display: inline-block; width: 19px; height: 19px; vertical-align: -4px; margin-inline: 2px; }
.card .install-hint { background: var(--surface-2); border-color: var(--line); color: var(--ink); max-width: none; }

/* ---------- timer ---------- */
#v-timer { padding-block: 6px 12px; gap: clamp(4px, 1dvh, 12px); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; flex: none; }
.me {
  display: flex; align-items: center; gap: 10px; min-width: 0; text-align: start;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px;
  padding-block: 4px; padding-inline: 4px 18px; color: var(--on);
}
.me-av { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--on); font-size: 23px; line-height: 1; }
.me-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.me-hello { font-size: 12.5px; font-weight: 600; color: var(--on-soft); }
.me-name { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 10px; }

.timer-main {
  flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
  gap: clamp(6px, 1.4dvh, 16px);
  --stage: min(78vw, 40vh, 440px);
}
@supports (height: 1dvh) { .timer-main { --stage: min(78vw, 40dvh, 440px); } }
.stage-col, .side-col { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1dvh, 12px); width: 100%; }
.side-col { gap: clamp(8px, 1.6dvh, 16px); }

.modes { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); width: min(100%, 430px); flex: none; }
.modes button {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 999px; background: transparent; color: var(--on);
  padding: 10px 4px; font-weight: 800; font-size: clamp(13.5px, 3.8vw, 16px); line-height: 1.2; white-space: nowrap;
  transition: background .25s, color .25s;
}
.modes button[aria-pressed="true"] { background: var(--on); color: var(--deep); box-shadow: 0 3px 10px rgba(0, 0, 0, .12); }

.stage { width: var(--stage); height: var(--stage); max-width: 100%; flex: none; }
.stage svg { width: 100%; height: 100%; overflow: visible; }
.ring-track { fill: none; stroke: var(--ring-track); stroke-width: 9; }
.ring-prog { fill: none; stroke: var(--on); stroke-width: 9; stroke-linecap: round; }
.ring-knob { fill: var(--on); filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .22)); }
.is-done .ring-prog, .is-done .ring-knob { opacity: 0; }
.stem { fill: none; stroke: var(--stem); stroke-width: 5.5; stroke-linecap: round; }
.leaf-shape, .calyx { fill: var(--leaf); }
.vein { fill: none; stroke: var(--leaf-vein); stroke-width: 1.4; stroke-linecap: round; opacity: .7; }
.soil { fill: var(--soil); }
.seed { fill: var(--seed); transition: opacity .5s; }
.pot-body, .pot-rim { fill: var(--deep); transition: fill .6s; }
.pot-rim-shine, .shine, .mug-rim { fill: var(--shine); }
.pot-gloss { fill: none; stroke: var(--shine); stroke-width: 4; stroke-linecap: round; }
.ground { fill: var(--ground); }
.plant { transform-box: view-box; transform-origin: 120px 166px; }
.stage.is-running .plant { animation: sway 3.6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
.spark { fill: var(--sun); opacity: 0; transform-box: fill-box; transform-origin: center; }
.is-bloomed .spark { animation: twinkle 1.8s ease-in-out infinite; }
.is-bloomed .spark:nth-child(2) { animation-delay: .45s; }
.is-bloomed .spark:nth-child(3) { animation-delay: .9s; }
.is-bloomed .spark:nth-child(4) { animation-delay: 1.35s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
.mug { fill: var(--deep); transition: fill .6s; }
.mug-handle { fill: none; stroke: var(--deep); stroke-width: 8; stroke-linecap: round; transition: stroke .6s; }
.mug-heart { fill: var(--on); opacity: .92; }
.steam { fill: none; stroke: var(--steam); stroke-width: 4.5; stroke-linecap: round; opacity: .2; }
.stage.is-running .steam { animation: steam 2.8s ease-in-out infinite; }
.steam.s2 { animation-delay: .7s !important; }
.steam.s3 { animation-delay: 1.4s !important; }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
.star { fill: var(--sun); transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.star.st2 { animation-delay: .8s; }
.star.st3 { animation-delay: 1.6s; }

.clock {
  display: flex; direction: ltr; justify-content: center; flex: none;
  font-size: calc(var(--stage) * .3); font-weight: 800; line-height: .95; color: var(--on);
  text-shadow: var(--text-shadow); margin-top: clamp(0px, .6dvh, 8px);
}
.clock .d { display: inline-block; width: .57em; text-align: center; }
.clock .colon { display: inline-block; width: .3em; text-align: center; transform: translateY(-.05em); }
.is-paused .clock { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .55; } }

.phrase {
  margin: 0; min-height: 2.7em; width: min(100%, 30ch); display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: clamp(16.5px, 2.3dvh, 22px); font-weight: 700; line-height: 1.35; color: var(--on);
  text-wrap: balance; text-shadow: var(--text-shadow); transition: opacity .25s ease, transform .25s ease;
}
.phrase.fade { opacity: 0; transform: translateY(4px); }

.subject-chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding-block: 6px; padding-inline: 16px 12px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); color: var(--on);
  font-weight: 800; font-size: 16px; max-width: 100%;
}
.subject-chip .chev { width: 18px; height: 18px; opacity: .85; flex: none; }
#subject-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 7vw, 38px); }
.ctl { flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; padding: 0; transition: transform .12s; }
.ctl-sm { width: 58px; height: 58px; background: var(--glass); border: 1px solid var(--glass-line); color: var(--on); }
.ctl-sm svg { width: 25px; height: 25px; }
.ctl-main { width: 88px; height: 88px; background: var(--on); color: var(--deep); box-shadow: 0 12px 28px rgba(42, 24, 64, .24), inset 0 -5px 0 rgba(42, 24, 64, .07); }
.ctl-main svg { width: 38px; height: 38px; }
.ctl-main .i-pause, .ctl-main.is-running .i-play { display: none; }
.ctl-main.is-running .i-pause { display: block; }

.cycle { display: flex; gap: 9px; align-items: center; justify-content: center; min-height: 12px; }
.cycle i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--on-faint); transition: background .3s, box-shadow .3s; }
.cycle i.on { background: var(--on); box-shadow: none; }

.today { display: none; gap: 10px; width: min(100%, 430px); }
.today-item { flex: 1 1 0; min-width: 0; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 10px 6px; text-align: center; }
.today-item b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
.today-item span { font-size: 13px; font-weight: 600; color: var(--on-soft); }
@media (min-height: 900px), (min-width: 900px) and (orientation: landscape) { .today { display: flex; } }

@media (max-height: 700px) {
  .timer-main { --stage: min(70vw, 33vh, 440px); }
  @supports (height: 1dvh) { .timer-main { --stage: min(70vw, 33dvh, 440px); } }
  .phrase { font-size: 16px; min-height: 2.6em; }
  .ctl-main { width: 74px; height: 74px; }
  .ctl-sm { width: 50px; height: 50px; }
  .modes button { padding-block: 8px; }
  .topbar { min-height: 48px; }
  .me-av { width: 38px; height: 38px; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .timer-main {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; align-items: center; justify-items: center;
    column-gap: 24px; --stage: min(40vw, 52vh, 500px);
  }
  @supports (height: 1dvh) { .timer-main { --stage: min(40vw, 52dvh, 500px); } }
  .modes { grid-column: 1 / -1; }
  .phrase { font-size: clamp(18px, 3dvh, 26px); }
}

/* ---------- sub pages (garden, settings) ---------- */
.subbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; min-height: 62px;
  padding-block: 8px; margin-inline: -4px; padding-inline: 4px;
  background: linear-gradient(var(--c1) 78%, transparent);
}
.subbar h2 { margin: 0; flex: 1; min-width: 0; text-align: center; font-size: 22px; font-weight: 800; line-height: 1.2; text-shadow: var(--text-shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subbar-space { width: 46px; flex: none; }
.page { display: flex; flex-direction: column; gap: 14px; width: min(100%, 700px); margin-inline: auto; padding-block: 4px 30px; }
.card { background: var(--surface); color: var(--ink); border-radius: 26px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; line-height: 1.3; text-wrap: balance; }
.card .sub { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h3 { margin: 0; }
.card-head span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.tile { background: var(--surface-2); border-radius: 18px; padding: 10px 6px; text-align: center; min-width: 0; }
.tile b { display: block; font-size: 26px; font-weight: 800; line-height: 1.15; color: var(--accent); font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; }

.bed {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); grid-auto-rows: 62px;
  padding: 10px 10px 0; border-radius: 20px; overflow: hidden;
  background:
    repeating-linear-gradient(to bottom, transparent 0 50px, var(--grass) 50px 62px) 0 10px / 100% 100% no-repeat,
    linear-gradient(var(--bed-sky1), var(--bed-sky2));
}
.bed .fl { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
.bed .mf { width: 40px; height: 58px; overflow: visible; }
.bed .fl.new .mf { animation: grow 1s cubic-bezier(.2, 1.4, .4, 1) both; transform-origin: 50% 100%; }
@keyframes grow { from { transform: scale(.1); opacity: 0; } to { transform: none; opacity: 1; } }
.bed-more { margin: 8px 0 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
.bed-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 16px 8px 6px; border-radius: 20px; background: linear-gradient(var(--bed-sky1), var(--bed-sky2)); }
.bed-empty svg { width: 120px; height: 120px; }
.bed-empty b { font-size: 18px; }
.bed-empty span { font-size: 14px; color: var(--ink-soft); max-width: 30ch; margin-bottom: 10px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.wk-val { font-size: 13px; font-weight: 800; color: var(--ink); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.wk-track { width: 100%; max-width: 34px; height: 120px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: flex-end; overflow: hidden; }
.wk-bar { width: 100%; border-radius: 12px; background: var(--accent); opacity: .5; min-height: 0; transition: height .5s ease; }
.wk.today .wk-bar { opacity: 1; }
.wk-day { font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.wk.today .wk-day { color: var(--accent); }

.subj-list { display: flex; flex-direction: column; gap: 10px; }
.subj-row { display: grid; grid-template-columns: auto 6.5em 1fr auto; align-items: center; gap: 10px; }
.subj-row .si { font-size: 20px; }
.subj-row .sn { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subj-row .sbar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.subj-row .sbar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.subj-row b { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty-note { margin: 0; font-size: 15px; color: var(--ink-soft); text-align: center; padding: 8px; }

.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { .badges { grid-template-columns: repeat(4, 1fr); } }
.bdg { background: var(--surface-2); border-radius: 18px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.bdg .bi { font-size: 34px; line-height: 1.2; }
.bdg b { font-size: 15px; line-height: 1.3; }
.bdg span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; }
.bdg.locked .bi { filter: grayscale(1); opacity: .32; }
.bdg.locked b { color: var(--ink-soft); }

/* settings */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 2px; }
.row.col { flex-direction: column; align-items: stretch; }
.row-label { display: flex; flex-direction: column; min-width: 0; }
.row-label b { font-size: 16px; font-weight: 700; line-height: 1.35; }
.row-label span { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.row-ctl { display: flex; align-items: center; gap: 10px; flex: none; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--accent); font-size: 22px; font-weight: 800; line-height: 1; display: grid; place-items: center; padding: 0; }
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 5.6em; text-align: center; font-weight: 800; font-size: 16px; }
.switch { flex: none; width: 54px; height: 32px; border-radius: 999px; border: 0; padding: 0; background: var(--line); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, .22); transition: inset-inline-start .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { inset-inline-start: 25px; }
.mini-btn { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--surface-2); color: var(--accent); font-weight: 800; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.seg button { border: 0; border-radius: 999px; padding: 9px 15px; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
input[type="range"] { width: min(52%, 220px); accent-color: var(--accent); height: 32px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.field-label { display: block; font-weight: 700; margin: 4px 0 6px; }
.field { width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
.field:focus { border-color: var(--accent); outline: none; }
.field::placeholder { color: var(--ink-soft); opacity: .8; }
.sec-label { display: block; font-weight: 700; margin: 16px 0 8px; }
.avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.av { aspect-ratio: 1; max-width: 100%; border-radius: 16px; border: 2px solid transparent; background: var(--surface-2); font-size: 26px; line-height: 1; display: grid; place-items: center; padding: 0; }
.av[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); box-shadow: 0 4px 12px rgba(42, 24, 64, .12); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; }
.sw i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(160deg, var(--s1), var(--s2)); flex: none; }
.sw[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
.add-row .field { flex: 1; }
.phrase-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.phrase-list li { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 8px 12px; font-weight: 600; }
.phrase-list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.del { flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); display: grid; place-items: center; padding: 0; }
.del svg { width: 18px; height: 18px; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.made-with { margin: 4px 0 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--on); text-shadow: var(--text-shadow); }

/* ---------- sheet, toast, confetti ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.sheet-panel {
  position: relative; width: min(100%, 540px); max-height: 90%; overflow-y: auto;
  background: var(--surface); color: var(--ink); border-radius: 30px 30px 0 0; box-shadow: var(--shadow);
  padding-top: 14px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .9, .25, 1);
}
.sheet-panel:focus { outline: none; }
.sheet-root.open .sheet-backdrop { opacity: 1; }
.sheet-root.open .sheet-panel { transform: none; }
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
@media (min-width: 700px) {
  .sheet-root { align-items: center; }
  .sheet-panel { border-radius: 30px; padding-bottom: 22px; transform: translateY(20px) scale(.96); opacity: 0; transition: transform .3s, opacity .25s; }
  .sheet-root.open .sheet-panel { transform: none; opacity: 1; }
  .sheet-grip { display: none; }
}
.sheet-title { margin: 0 0 4px; font-size: 23px; font-weight: 800; line-height: 1.3; text-align: center; text-wrap: balance; }
.sheet-text { margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: var(--ink-soft); text-align: center; text-wrap: balance; }
.sheet-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
.ask { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ask-ic { font-size: 50px; line-height: 1.2; margin-bottom: 4px; }
.celebrate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.cel-flower { width: 156px; height: 156px; margin-top: -4px; }
.cel-flower svg { width: 100%; height: 100%; overflow: visible; animation: pop .8s cubic-bezier(.2, 1.5, .4, 1) both; transform-origin: 50% 80%; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.cel-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 10px; }
.cel-stats span { background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14.5px; }
.cel-badge { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; background: var(--surface-2); border: 2px dashed var(--accent); border-radius: 20px; padding: 10px 14px; margin-bottom: 6px; }
.cel-badge .bi { font-size: 36px; line-height: 1; }
.cel-badge b { display: block; font-size: 16px; }
.cel-badge span { font-size: 13.5px; color: var(--ink-soft); }
.subj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.subj {
  position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; text-align: start;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 12px; font-weight: 700; font-size: 16px;
}
.subj .si { font-size: 22px; line-height: 1; flex: none; }
.subj .sn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subj[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.subj-wrap { position: relative; }
.subj-del { position: absolute; top: -8px; inset-inline-end: -6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); display: grid; place-items: center; padding: 0; }
.subj-del svg { width: 14px; height: 14px; }

.toast {
  position: fixed; z-index: 70; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px);
  max-width: calc(100% - 32px); transform: translate(-50%, -16px); opacity: 0;
  background: var(--surface); color: var(--ink); border-radius: 999px; padding: 10px 20px;
  font-weight: 700; font-size: 15px; text-align: center; box-shadow: var(--shadow);
  transition: transform .3s, opacity .3s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
#confetti { position: fixed; inset: 0; z-index: 60; width: 100%; height: 100%; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

</style>

<body>

<script>
(() => {
  'use strict';
  const doc = document, root = doc.documentElement;
  root.lang = 'ar'; root.dir = 'rtl';

  /* ---------- helpers ---------- */
  const $ = (s, r = doc) => r.querySelector(s);
  const $$ = (s, r = doc) => Array.from(r.querySelectorAll(s));
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const pad2 = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rand = a => a[Math.floor(Math.random() * a.length)];
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const setHidden = (el, h) => { if (!el) return; if (h) el.setAttribute('hidden', ''); else el.removeAttribute('hidden'); };
  const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const APP_TITLE = doc.title || 'ميمي ووتين';

  /* ---------- storage (works even when the browser blocks it) ---------- */
  const KEY = 'mw-focus-v1', TKEY = 'mw-focus-timer-v1';
  const mem = {};

  doc.addEventListener('keydown', e => {
    if (e.code !== 'Space' || view !== 'timer' || Sheet.isOpen()) return;
    if (e.target !== doc.body && e.target !== root) return;
    e.preventDefault(); $('#play-btn').click();
  });
  doc.addEventListener('pointerdown', () => {
    Sound.resume();
    const s = P().settings;
    if (T.status === 'running' && T.mode === 'focus' && s.ambient !== 'none' && !Sound.playing()) Sound.startAmbient(s.ambient, s.volume / 100);
  }, { passive: true });
  const wake = () => {
    if (doc.visibilityState !== 'visible') return;
    if (T.status === 'running') { tick(); Wake.refresh(); }
    if (view === 'timer') { $('#me-hello').textContent = greet(); renderToday(); }
  };
  doc.addEventListener('visibilitychange', wake);
  window.addEventListener('pageshow', wake);
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); installEvent = e;
    if (view === 'profiles') renderProfiles();
    if (view === 'settings') renderSettings();
  });
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => updateThemeColor();
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }
  if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  /* ---------- start ---------- */
  initStage();
  applyAppearance();
  if (data.current && T.pid !== data.current) freshTimer(data.current);
  if (!T.flower) T.flower = newFlower();
  if (data.current && !T.duration) { T.duration = durFor(T.mode); T.remaining = T.duration; }
  show(!data.welcomed ? 'welcome' : !data.current ? 'profiles' : 'timer');
  if (data.current) {
    if (T.status === 'running') {
      if (T.endAt <= Date.now()) { T.remaining = 0; complete(); }
      else { startTick(); Wake.set(P().settings.wake); setPhrase(T.mode === 'focus' ? pick('during') : pick('breakTip'), true); lastRotate = Date.now(); }
    } else setPhrase(T.status === 'paused' ? pick('pause') : idlePhrase(), true);
  }
})();

</script>
</body>
</html>
